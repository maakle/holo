[build]
builder = "DOCKERFILE"
watchPatterns = ["apps/web/**", "apps/gateway/**", "apps/worker/**", "packages/**"]

[[services]]
name = "holo-web"
source = "apps/web/Dockerfile"
healthcheckPath = "/api/health"

[services.variables]
PORT = "3000"
NODE_ENV = "production"
MIGRATIONS_DIR = "/repo/migrations"

[[services]]
name = "holo-gateway"
source = "apps/gateway/Dockerfile"
healthcheckPath = "/health"

[services.variables]
MCP_PORT = "8080"
NODE_ENV = "production"

[[services]]
name = "holo-worker"
source = "apps/worker/Dockerfile"

[services.variables]
NODE_ENV = "production"

[[services]]
name = "postgres"
image = "pgvector/pgvector:pg16"

[services.variables]
POSTGRES_DB = "holo"
POSTGRES_USER = "holo"
POSTGRES_PASSWORD = "${{POSTGRES_PASSWORD}}"

[[services]]
name = "redis"
image = "redis:7-alpine"
