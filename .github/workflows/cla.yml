name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Required for cla-assistant to write contributor signatures back to the
# `cla-signatures` branch and to comment on pull requests.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: |
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'cla-signatures/v1.json'
          path-to-document: 'https://github.com/maakle/holo/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: dependabot[bot],renovate[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          remote-organization-name: maakle
          remote-repository-name: holo
          create-file-commit-message: 'chore(cla): record contributor signature'
          signed-commit-message: 'chore(cla): @$contributorName signed CLA in $pullRequestNo'
