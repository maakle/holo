name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: Step-by-step. Include any commands, payloads, or URLs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: |
        - Memex version / commit
        - Self-hosted (docker compose / Railway / Coolify / Kubernetes / other) or development
        - Postgres version
        - Node version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Relevant logs from `api`, `worker`, `mcp`, or `web` containers
