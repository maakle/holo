services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: holo
      POSTGRES_PASSWORD: holo
      POSTGRES_DB: holo
    ports:
      - "5436:5432"
    volumes:
      - holo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - holo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  holo_pg_data:
  holo_redis_data:
