# Two startup modes:
#   docker compose up -d                  → infra only (postgres + redis). Pair with `pnpm dev`.
#   docker compose --profile app up -d    → full stack (infra + web/gateway/worker). Self-host / quickstart.
# Services tagged with `profiles: ["app"]` are skipped unless the profile is active.
services:
  postgres:
    image: pgvector/pgvector:pg16
    # Localhost-only dev DB. All credentials come from .env; nothing literal here.
    # See .env.example — POSTGRES_PASSWORD must be set (compose fails fast otherwise).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-holo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-holo}
    ports:
      - "5436:5432"
    volumes:
      - holo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    volumes:
      - holo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["pnpm", "-F", "@holo/db", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-holo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-holo}
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-holo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-holo}
      REDIS_URL: redis://redis:6379
      HOLO_TOKEN_ENCRYPTION_KEY: ${HOLO_TOKEN_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment: *app_env
    ports:
      - "8080:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment: *app_env
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  holo_pg_data:
  holo_redis_data:
